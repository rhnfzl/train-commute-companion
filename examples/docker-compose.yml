services:
  tcc:
    build: ..  # run from examples/: the checkout root holds the Dockerfile
    image: train-commute-companion:local
    restart: unless-stopped
    read_only: true
    # .env sits next to this file and holds the secrets (never commit it):
    #   NS_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, and optionally OWNTRACKS_SECRET and TCC_HEALTH_TOKEN
    #   optional webhooks: TCC_WEBHOOK_URLS, TCC_WEBHOOK_SECRET (required with URLs), TCC_WEBHOOK_TOKEN
    # after editing it: docker compose up -d --force-recreate tcc (restart keeps the old values)
    env_file: .env
    volumes:
      # a directory, so an editor that replaces profiles.yaml is still seen
      - ./config:/config:ro
      - tcc-data:/data
    ports:
      - "8080:8080"
  # the MCP relay (docs/mcp.md): started per session by the MCP client, never by `up`
  mcp:
    image: train-commute-companion:local
    profiles: [mcp]
    read_only: true
    env_file: .env  # only TCC_STATE_DIR is read, to find the socket
    volumes:
      - tcc-data:/data
    # the image's check probes the app's port, where the relay never listens
    healthcheck:
      disable: true
    command: ["python", "-m", "tcc_app.mcp_server"]

volumes:
  tcc-data:
