# Starter profiles file. Copy it, edit it, check it with `tcc check-profile`.
# Station codes are NS codes. AAA is a made-up placeholder; UT and RTD are examples.
# A station name also works instead of a code, for example "Utrecht Centraal" for UT.
# Quote every time ("08:12"), otherwise YAML reads it as a number.
profiles:
  - id: "p1"                  # immutable, any unique string; never change it after first use
    name: "office_a"          # editable; becomes the prefix of the Home Assistant entities
    traveller: "me"           # fixed in v1, the only allowed value
    days: [tue, wed]          # weekdays: mon tue wed thu fri sat sun
    extra_dates: []           # optional one-off dates, YYYY-MM-DD
    pauses: []                # optional inclusive ranges: [{start: "2026-12-21", end: "2027-01-03"}]
    skip_public_holidays: true  # skip Dutch public holidays on the weekdays above
    home_station: "AAA"       # NS station code of the home side
    work_station: "RTD"       # NS station code of the work side, never the home station
    outbound:                 # home to work
      first_train: "08:12"    # the train you normally take first
      transfers: ["UT"]       # transfer stations in travel order; [] for a direct train
      window: ["07:12", "10:12"]  # when to follow; default is first train -60 / +120 min
      buffer_min: 10          # minutes from the door to the platform
      # active_lead_min: 25   # check-in minutes before your train; default buffer_min + 15
      earlier_train_advice: false  # suggest an earlier train when yours is late
    return:                   # work to home
      day_offset: 0           # 1 when you travel back the morning after (night shift)
      first_train: "17:52"
      transfers: ["UT"]
      buffer_min: 5
      earlier_train_advice: true
      # Window mode instead of one usual train, see docs/weekday-schedules.md:
      # mode: window
      # window: ["15:00", "20:00"]  # earliest and latest departure
      # pick: earliest              # earliest, earliest_silent or on_leave
      # min_stay_min: 480           # start no earlier than 8 h after you arrived
      # by_weekday:                 # other settings on single days
      #   fri: {window: ["13:00", "18:00"], min_stay_min: 300}
      # other_stations: [GV]        # board here too, see docs/other-boarding-station.md
    transfer_min: { UT: 4 }   # minutes you need to change trains, for every transfer station
    alerts:
      leave_by: true          # show leave-by time in check-in, pre-trip advice and HA status
      weather: true                    # station forecasts and tips; warnings need your own KNMI key
      earlier_train_threshold_min: 10   # advise an earlier train from this much delay
      earlier_train_min_saving_min: 5   # only if it saves at least this much
      latest_acceptable_arrival: null   # optional "HH:MM"; later arrival makes delays loud
      quiet_hours: ["19:52", "07:12"]   # quiet events wait; loud ones still go out
    location: null            # optional; omit to run on times only
    # location:                 # Home Assistant source, see docs/location-ha.md
    #   source: ha
    #   entity: person.me
    #   zones: { home: zone.home, work: zone.work }
    #   station_radius_m: 150
    #   wifi: { home: device_tracker.phone_wifi }   # optional: proves a miss at home sooner
    #   activity_entity: sensor.phone_activity      # optional: phone motion (riding or at rest)
    #   other_station_radius_m: 500    # another boarding station counts this near
    #   other_station_dwell_min: 0     # 0: one fix is enough
    #   ask_to_remember_station: true  # after Yes at a new station, offer to remember it
  - id: "p2"
    name: "office_b"
    traveller: "me"
    days: [thu]
    extra_dates: []
    skip_public_holidays: true
    home_station: "AAA"
    work_station: "UT"
    outbound:
      first_train: "08:12"
      transfers: []
      buffer_min: 10
      earlier_train_advice: false
    return:
      first_train: "17:52"
      transfers: []
      buffer_min: 5
      earlier_train_advice: true
    transfer_min: {}
