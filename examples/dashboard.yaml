# Paste this card into a Home Assistant dashboard's manual card editor.
# Replace office_a with the entity IDs from your integration, not the profile id.
type: vertical-stack
cards:
  - type: markdown
    title: Commute to work
    content: |-
      {% set base = 'sensor.office_a_outbound' %}
      {% set health = 'sensor.office_a_health' %}
      {% set direction = 'outbound' %}
      {% set status = states(base ~ '_status') %}
      {% macro clock(value) -%}
        {%- set parsed = as_datetime(value, none) -%}
        {{- as_local(parsed).strftime('%a %H:%M') if parsed else 'Unknown' -}}
      {%- endmacro %}
      **Journey:** {{ status if status not in ['unknown', 'unavailable'] else 'Unknown' }}

      **Data health:** {{ states(health) }}
      {% if states(health) != 'ok' %}
      **Data is not verified for an active journey. Check NS before acting on stored times.**
      {% endif %}
      Last successful NS answer: {{ clock(state_attr(health, direction ~ '_last_ok_at')) }}

      {% if status == 'none' %}
      No journey is being followed.
      {% elif status not in ['unknown', 'unavailable'] %}
      **Followed trains**
      {% for leg in states.sensor | selectattr('entity_id', 'match', '^' ~ base ~ '_leg_[0-9]+$') | sort(attribute='entity_id') %}
      {% if leg.state != 'none' %}
      {% set a = leg.attributes %}
      - **{{ a.get('train_number', 'Unknown') }}: {{ a.get('board', 'Unknown') }} to {{ a.get('alight', 'Unknown') }}** ({{ leg.state }})
        - Departure: {{ clock(a.get('departure') or a.get('planned_departure')) }}{{ ' (planned)' if not a.get('departure') else '' }}; platform: {{ a.get('departure_platform') or 'Unknown' }}; delay: {{ a.get('departure_delay_min') if a.get('departure_delay_min') is not none else 'Unknown' }}{{ ' min' if a.get('departure_delay_min') is not none else '' }}
        - Arrival: {{ clock(a.get('arrival') or a.get('planned_arrival')) }}{{ ' (planned)' if not a.get('arrival') else '' }}; platform: {{ a.get('arrival_platform') or 'Unknown' }}
        - Crowd forecast per NS: {{ a.get('crowd_forecast') or 'Unknown' }}
      {% endif %}
      {% endfor %}
      {% for transfer in states.sensor | selectattr('entity_id', 'match', '^' ~ base ~ '_transfer_[0-9]+$') | sort(attribute='entity_id') %}
      {% if transfer.state != 'none' %}
      {% set a = transfer.attributes %}
      - **Transfer {{ a.get('station', 'Unknown') }}:** {{ transfer.state }}; margin: {{ a.get('margin_min') if a.get('margin_min') is not none else 'Unknown' }}{{ ' min' if a.get('margin_min') is not none else '' }}; minimum: {{ a.get('minimum') if a.get('minimum') is not none else 'Unknown' }}{{ ' min' if a.get('minimum') is not none else '' }}
      {% endif %}
      {% endfor %}
      {% endif %}

      **Next catchable connection:** {{ clock(states(base ~ '_next_connection')) }}
      Arrival: {{ clock(state_attr(base ~ '_next_connection', 'arrival')) }}; platform: {{ state_attr(base ~ '_next_connection', 'platform') or 'Unknown' }}
      First train crowd forecast per NS: {{ state_attr(base ~ '_next_connection', 'crowd_forecast') or 'Unknown' }}

      **Earlier train advice:** {{ clock(states(base ~ '_earlier_train_advice')) }}

      **Planned works:** {{ states(base ~ '_works_ahead') }} flagged dates in the checked horizon.
      {% for item in state_attr(base ~ '_works_ahead', 'dates') or [] %}
      - {{ item.date }} (leg {{ item.leg }})
      {% endfor %}
      Last works check: {{ clock((state_attr(health, 'lookahead_last_ok') or {}).get(direction)) }}

      Data: NS
  - type: horizontal-stack
    cards:
      - type: button
        entity: button.office_a_outbound_leaving
        name: Leaving
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.office_a_outbound_leaving
      - type: button
        entity: button.office_a_outbound_choose_next
        name: Choose next
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.office_a_outbound_choose_next
      - type: button
        entity: button.office_a_outbound_not_travelling
        name: Skip outbound
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.office_a_outbound_not_travelling
      - type: button
        entity: button.office_a_not_travelling_today
        name: Skip today
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.office_a_not_travelling_today
