[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "train-commute-companion"
version = "0.1.2"
description = "Follows your usual NS train journey and alerts you when it changes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
app = ["mcp>=2.3,<3"]

[project.scripts]
tcc = "train_commute_companion.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML"]
# the mobile_app requirement chain (cloud, camera, assist_pipeline ...) that test_notifier.py loads
ha = [
    "pytest-homeassistant-custom-component==0.13.375; python_full_version >= '3.14.2'",
    "Pillow==12.3.0; python_full_version >= '3.14.2'",
    "PyNaCl==1.6.2; python_full_version >= '3.14.2'",
    "PyTurboJPEG==1.8.3; python_full_version >= '3.14.2'",
    "aiohasupervisor==0.6.0; python_full_version >= '3.14.2'",
    "aiousbwatcher==1.1.2; python_full_version >= '3.14.2'",
    "bleak-retry-connector==4.7.1; python_full_version >= '3.14.2'",
    "bleak==3.0.2; python_full_version >= '3.14.2'",
    "bluetooth-adapters==2.4.0; python_full_version >= '3.14.2'",
    "bluetooth-auto-recovery==1.6.4; python_full_version >= '3.14.2'",
    "bluetooth-data-tools==1.29.24; python_full_version >= '3.14.2'",
    "cronsim==2.7; python_full_version >= '3.14.2'",
    "dbus-fast==5.0.22; python_full_version >= '3.14.2'",
    "gazetteer-matcher==1.1.0; python_full_version >= '3.14.2'",
    "ha-ffmpeg==3.2.2; python_full_version >= '3.14.2'",
    "habluetooth==7.1.2; python_full_version >= '3.14.2'",
    "hass-nabucasa==2.7.0; python_full_version >= '3.14.2'",
    "hassil==3.12.1; python_full_version >= '3.14.2'",
    "home-assistant-intents==2026.10.6; python_full_version >= '3.14.2'",
    "matter-ble-proxy==0.7.1; python_full_version >= '3.14.2'",
    "matter-python-client==1.4.0; python_full_version >= '3.14.2'",
    "mutagen==1.48.1; python_full_version >= '3.14.2'",
    "openai==3.10.0; python_full_version >= '3.14.2'",
    "pymicro-vad==1.0.1; python_full_version >= '3.14.2'",
    "pyspeex-noise==1.0.2; python_full_version >= '3.14.2'",
    "securetar==2026.4.1; python_full_version >= '3.14.2'",
    "serialx==1.11.0; python_full_version >= '3.14.2'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/train_commute_companion"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests_app"]
pythonpath = ["tests", ".", "app"]
