name: Validate

on:
  push:
    # Rehan checks these branches locally. The batch runs the full suite on its PR.
    branches-ignore: ["batch/rhnfzl-*", "work/rhnfzl/**"]
    tags: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  image:
    # builds both release platforms without pushing, so a broken Dockerfile shows before a release
    name: Docker image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ha-latest:
    # the integration calls private mobile_app code, so a new HA release can break it unannounced
    name: Newest Home Assistant
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.14 --group ha
      - run: uv pip install --upgrade pytest-homeassistant-custom-component
      - run: uv run --no-sync pytest tests_ha -q
