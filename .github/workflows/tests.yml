# shared by Validate and Release, so a release waits on the project's own checks only
name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: what to check out; empty means the triggering commit
        type: string
        default: ""
      parallel:
        description: use pytest workers for validation; release dispatch can check out older tags
        type: boolean
        default: false

permissions: {}

jobs:
  windows-storage:
    name: Windows storage
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run --locked --extra app pytest -q tests/test_store.py tests/test_delivery_transitions.py tests/test_writer_transitions.py tests/test_writer_model.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"  # the Docker image's Python
      - name: Install locked dependencies
        run: uv sync --locked --extra app
      - name: Lint
        run: uv run --no-sync ruff check src tests tests_ha tests_app tests_live custom_components app
      - name: Type check core and app
        run: uv run --no-sync mypy src app/tcc_app
      - name: Test core and app
        run: uv run --no-sync pytest -q --durations=10
        env:
          PYTEST_ADDOPTS: ${{ inputs.parallel && '-n 4 --dist worksteal' || '' }}

  dependency-floors:
    name: Dependency floors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      # The published floors differ from the locked versions and resolve in isolation.
      - name: Test published dependency floors
        run: >-
          uv run --no-cache --isolated --no-project --python 3.12 --with '.[app]' --with httpx==0.27.0
          --with PyYAML==6.0.1 --with mcp==2.3.0 --with pytest --with pytest-asyncio
          ${{ inputs.parallel && '--with pytest-xdist==3.8.0' || '' }}
          pytest -q --durations=10 tests tests_app
        env:
          PYTEST_ADDOPTS: ${{ inputs.parallel && '-n 4 --dist worksteal' || '' }}

  home-assistant:
    name: Home Assistant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          cache-suffix: home-assistant
      - name: Install locked Home Assistant dependencies
        run: uv sync --locked --group ha
      - name: Type check Home Assistant
        run: >-
          uv run --no-sync mypy --explicit-package-bases
          --namespace-packages -p custom_components.train_commute_companion
      - name: Test Home Assistant
        run: uv run --no-sync pytest tests_ha -q --durations=10
        env:
          PYTEST_ADDOPTS: ${{ inputs.parallel && '-n 4 --dist worksteal' || '' }}
