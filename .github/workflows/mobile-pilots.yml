name: Mobile pilots

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-pilots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iPhone pilot
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Test the portable Swift code
        run: |
          checks_dir=$(mktemp -d)
          swiftc -swift-version 6 -warnings-as-errors Sources/CommuteCore/*.swift \
            Tests/CommuteCoreTests/*.swift -o "$checks_dir/commute-checks"
          "$checks_dir/commute-checks"
      - name: Build the app and widget for the simulator
        run: |
          xcodegen generate
          xcodebuild -project TrainCommute.xcodeproj -scheme TrainCommute \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android:
    name: Android pilot
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
