name: Release

on:
  release:
    types: [published]
  # pushes the image again for an existing release, for example after a failed push; never publishes to PyPI
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.0
        required: true

permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

  pypi:
    name: PyPI
    needs: tests
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # trusted publishing: PyPI trusts this workflow and environment, no token is stored
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Docker image
    needs: tests
    # one push at a time, so an older run cannot finish last and move the shared tags back
    concurrency: docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # also refuses a dispatch tag that has no release
      - name: Read the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -o pipefail  # a failed release list must fail the step, not drop the major.minor tag
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
          echo "latest=$([ "$newest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # major.minor follows the newest stable release of its series, never a prerelease or an older patch
          series=$(echo "$TAG" | sed -E 's/^(v?[0-9]+\.[0-9]+\.).*/\1/')
          top=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' | awk -v s="$series" 'index($0, s) == 1' | sort -V | tail -n 1)
          echo "minor=$([ "$top" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # the checked-out tag, not the dispatch branch, gives the revision label
          context: git
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # latest follows the release GitHub marks latest, so pushing an older tag again leaves it alone
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.event.release.tag_name }},enable=${{ steps.release.outputs.minor }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
