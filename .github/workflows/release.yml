name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    # trusted publishing: PyPI trusts this workflow and environment, no token is stored
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
